<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Leonida Explorer</title>
    <style>
      html, body { margin: 0; height: 100%; background: #2a0b3d; color: #fff; font-family: -apple-system, system-ui, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 32px; box-sizing: border-box; }
      h1 { font-size: 24px; margin: 0; }
      p { margin: 0; opacity: .8; line-height: 1.5; }
      button { align-self: flex-start; margin-top: 8px; padding: 12px 20px; border: 0; border-radius: 999px; background: #ff4fa3; color: #fff; font-size: 16px; font-weight: 600; }
    </style>
  </head>
  <body>
    <main data-testid="ios-offline-screen">
      <h1>Keine Verbindung</h1>
      <p>Leonida Explorer braucht eine Internetverbindung. Bitte prüfe WLAN oder mobile Daten.</p>
      <button data-testid="ios-offline-retry-button" onclick="location.replace('https://leonida-preview-2.emergent.host/')">Erneut versuchen</button>
    </main>
  </body>
</html>
